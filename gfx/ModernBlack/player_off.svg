<?xml version="1.0" encoding="UTF-8"?>
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="idle_sphere" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E2330"/>
      <stop offset="100%" stop-color="#0F1117"/>
    </linearGradient>
    <linearGradient id="idle_ring" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2D3546"/>
      <stop offset="100%" stop-color="#141720"/>
    </linearGradient>
    <linearGradient id="idle_spec" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0"/>
    </linearGradient>
  </defs>

  <!-- Outer Ring Bezel -->
  <circle cx="64" cy="64" r="49" fill="#060709" stroke="url(#idle_ring)" stroke-width="3"/>

  <!-- Core Idle Sphere -->
  <circle cx="64" cy="64" r="43" fill="url(#idle_sphere)"/>

  <!-- Top Specular Curve -->
  <ellipse cx="64" cy="42" rx="28" ry="16" fill="url(#idle_spec)"/>
</svg>
